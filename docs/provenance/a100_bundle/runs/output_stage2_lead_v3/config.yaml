data:
  train_dataset:
    vla_preprocess_args:
      _target_: alpamayo.processor.qwen_processor.get_preprocess_data_fn_from_model_config
      chat_template_version: r1_5
      components_order:
      - image
      - traj_history
      - route
      - prompt
      - traj_future
      components_prompt:
      - traj_future
      label_components:
      - traj_future
      include_camera_ids: true
      include_frame_nums: true
      generation_mode: false
    _recursive_: false
    _target_: alpamayo.data.pai_nav.PAIDatasetWithNav
    local_dir: /workspace/lead-alpamayo-pai_large_v3
    chunk_ids: null
    use_default_keyframe: true
    annotations_path: /workspace/lead-alpamayo-pai_large_v3/annotations_train.json
  val_dataset:
    vla_preprocess_args:
      _target_: alpamayo.processor.qwen_processor.get_preprocess_data_fn_from_model_config
      chat_template_version: r1_5
      components_order:
      - image
      - traj_history
      - route
      - prompt
      - traj_future
      components_prompt:
      - traj_future
      label_components:
      - traj_future
      include_camera_ids: true
      include_frame_nums: true
      generation_mode: true
    _recursive_: false
    _target_: alpamayo.data.pai_nav.PAIDatasetWithNav
    local_dir: /workspace/lead-alpamayo-pai_large_v3
    chunk_ids: null
    use_default_keyframe: true
    annotations_path: /workspace/lead-alpamayo-pai_large_v3/annotations_val.json
  collate_fn:
    _target_: alpamayo.processor.qwen_processor.collate_fn_from_model_config
    _partial_: true
    chat_template_version: r1_5
paths:
  output_dir: output_stage2_lead_v3
callbacks: {}
evaluate:
  max_eval_steps: -1
  torch_dtype: bfloat16
  metric_runner:
    _target_: alpamayo.metrics.metric_runner.MetricRunner
    metrics:
    - _target_: alpamayo.metrics.metric_api.ReasoningSampler
      num_traj_sets: 1
      top_p: 0.98
      temperature: 0.6
      traj_only_generation: false
      max_generation_length: 256
    - _target_: alpamayo.metrics.metric_api.DistanceMetrics
  eval_ckpt: null
trainer:
  output_dir: ${paths.output_dir}
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 2
  gradient_accumulation_steps: 8
  learning_rate: 0.0001
  warmup_steps: 200
  logging_steps: 5
  save_steps: 400
  save_total_limit: 6
  save_only_model: true
  num_train_epochs: 8
  bf16: true
  dataloader_pin_memory: false
  dataloader_num_workers: 0
  dataloader_persistent_workers: false
  dataloader_prefetch_factor: null
  remove_unused_columns: false
  report_to: none
  lr_scheduler_type: cosine_warmup_with_min_lr
  lr_scheduler_kwargs:
    min_lr: 1.0e-06
  deepspeed: null
  gradient_checkpointing: false
  gradient_checkpointing_kwargs:
    use_reentrant: false
  ddp_find_unused_parameters: true
task_name: alpamayo_1_5_sft_stage2_nav
run_name: ${task_name}_${now:%Y%m%d}_${now:%H%M%S}
performance:
  zip_cache: false
  collate_cache: true
  tf32: true
  cudnn_benchmark: true
model:
  _target_: alpamayo1_5_sft.models.sft_alpamayo_r1.TrainableAlpamayoR1.from_pretrained
  pretrained_model_name_or_path: /workspace/Alpamayo-1.5-10B-A1-format
  dtype: auto
  cotrain_vlm: false
  stage1_vlm_checkpoint_path: /workspace/Alpamayo-1.5-10B-A1-format
hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: RUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.mode=RUN
    task:
    - model.pretrained_model_name_or_path=/workspace/Alpamayo-1.5-10B-A1-format
    - model.stage1_vlm_checkpoint_path=/workspace/Alpamayo-1.5-10B-A1-format
    - data.train_dataset.local_dir=/workspace/lead-alpamayo-pai_large_v3
    - data.train_dataset.annotations_path=/workspace/lead-alpamayo-pai_large_v3/annotations_train.json
    - data.train_dataset.chunk_ids=null
    - data.val_dataset.local_dir=/workspace/lead-alpamayo-pai_large_v3
    - data.val_dataset.annotations_path=/workspace/lead-alpamayo-pai_large_v3/annotations_val.json
    - data.val_dataset.chunk_ids=null
    - trainer.learning_rate=1e-4
    - trainer.lr_scheduler_type=cosine_warmup_with_min_lr
    - trainer.warmup_steps=200
    - trainer.gradient_accumulation_steps=8
    - trainer.num_train_epochs=8
    - trainer.save_steps=400
    - trainer.save_total_limit=6
    - trainer.logging_steps=5
    - trainer.dataloader_num_workers=0
    - trainer.dataloader_pin_memory=false
    - trainer.dataloader_persistent_workers=false
    - trainer.dataloader_prefetch_factor=null
    - trainer.save_only_model=true
    - performance.zip_cache=false
    - paths.output_dir=output_stage2_lead_v3
  job:
    name: train_hf
    chdir: null
    override_dirname: data.train_dataset.annotations_path=/workspace/lead-alpamayo-pai_large_v3/annotations_train.json,data.train_dataset.chunk_ids=null,data.train_dataset.local_dir=/workspace/lead-alpamayo-pai_large_v3,data.val_dataset.annotations_path=/workspace/lead-alpamayo-pai_large_v3/annotations_val.json,data.val_dataset.chunk_ids=null,data.val_dataset.local_dir=/workspace/lead-alpamayo-pai_large_v3,model.pretrained_model_name_or_path=/workspace/Alpamayo-1.5-10B-A1-format,model.stage1_vlm_checkpoint_path=/workspace/Alpamayo-1.5-10B-A1-format,paths.output_dir=output_stage2_lead_v3,performance.zip_cache=false,trainer.dataloader_num_workers=0,trainer.dataloader_persistent_workers=false,trainer.dataloader_pin_memory=false,trainer.dataloader_prefetch_factor=null,trainer.gradient_accumulation_steps=8,trainer.learning_rate=1e-4,trainer.logging_steps=5,trainer.lr_scheduler_type=cosine_warmup_with_min_lr,trainer.num_train_epochs=8,trainer.save_only_model=true,trainer.save_steps=400,trainer.save_total_limit=6,trainer.warmup_steps=200
    id: ???
    num: ???
    config_name: sft_stage2_nav
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  verbose: false
