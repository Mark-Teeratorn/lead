name: CI

on:
  push:
    branches: [ main, pre-release ]
  workflow_dispatch:

jobs:
  test-and-lint:
    runs-on: self-hosted

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Configure .env
      run: |
        cp .env.example .env
        sed -i "s|^CARLA_ROOT=.*|CARLA_ROOT=${GITHUB_WORKSPACE}/3rd_party/CARLA/standard_0916|" .env

    - name: Provision Python venv
      uses: ./.github/actions/python_venv

    - name: Install project
      # uv's own cache in ~/.cache/uv persists on the runner, so this is fast.
      run: uv pip install -e "."

    - name: Run unit tests
      env:
        LEAD_RUNTIME_TYPE_CHECKING: "true"
      run: >
        pytest tests/unittests
        --cov --cov-report=term-missing --cov-report=xml

    - name: Coverage summary
      if: always()
      run: |
        {
          echo '<details><summary>Coverage by file</summary>'
          echo
          echo '```'
          coverage report
          echo '```'
          echo '</details>'
        } >> "$GITHUB_STEP_SUMMARY"

    # pre-commit's own cache in ~/.cache/pre-commit persists on the runner.
    - name: Run pre-commit
      run: pre-commit run --all-files
