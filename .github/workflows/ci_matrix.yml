name: Compat Matrix

on:
  push:
    branches: [ main, pre-release ]
  workflow_dispatch:

concurrency:
  group: ci-matrix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: self-hosted
    timeout-minutes: 90
    strategy:
      fail-fast: false
      # One self-hosted machine runs the legs one at a time.
      max-parallel: 1
      matrix:
        python: [ "3.10", "3.11", "3.12" ]
        numpy: [ "1.26", "2.2" ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Configure .env
      run: |
        cp .env.example .env
        sed -i "s|^CARLA_ROOT=.*|CARLA_ROOT=${GITHUB_WORKSPACE}/3rd_party/CARLA/standard_0916|" .env

    - name: Provision Python venv
      uses: ./.github/actions/python_venv
      with:
        python-version: ${{ matrix.python }}

    - name: Install project
      run: uv pip install -e "."

    - name: Force the matrix numpy
      # Deliberately overrides the pyproject pin; the cell proves (or disproves)
      # that the installed stack works under this numpy.
      run: uv pip install "numpy==${{ matrix.numpy }}.*"

    - name: Report resolved versions
      run: |
        python - <<'EOF' | tee -a "$GITHUB_STEP_SUMMARY"
        import sys
        print(f"- python {sys.version.split()[0]}")
        for mod in ("numpy", "torch", "cv2", "scipy", "lightning"):
            try:
                m = __import__(mod)
                print(f"- {mod} {m.__version__}")
            except Exception as error:
                print(f"- {mod} UNIMPORTABLE: {type(error).__name__}: {error}")
        EOF

    - name: Run unit tests
      env:
        LEAD_RUNTIME_TYPE_CHECKING: "true"
      run: pytest tests/unittests
